# ==============================================================================
# Docker Compose Infrastructure - Project J26-IT-358
# "Data-Driven Farmer Decision System for Collaborative Crop Planning and Market Risk Reduction"
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Shared PostgreSQL + PostGIS Spatial Database
  # ----------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: agri_postgis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agri_network

  # ----------------------------------------------------------------------------
  # 2. Redis Message Broker & Cache (for Celery Background Tasks)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agri_redis_cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agri_network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ------------------------------------------------------------------------------
# Internal Docker Network
# ------------------------------------------------------------------------------
networks:
  agri_network:
    driver: bridge
